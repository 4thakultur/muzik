[package]
name = "muzik-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
muzik-common.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
time = "0.3"
futures-util = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "trace", "fs", "set-header", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
lofty = "0.22"
symphonia = { version = "0.5", features = ["all"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
walkdir = "2"
mime_guess = "2"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Inkult connector (sign-in through an Inkult server). Bundled web PKI roots,
# so HTTPS works without a system CA store in the runtime image.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
