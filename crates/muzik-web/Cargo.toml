[package]
name = "muzik-web"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
muzik-common.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"
web-sys = { version = "0.3", features = [
  "Document", "Window", "Navigator", "Storage", "Element", "HtmlElement",
  "HtmlAudioElement", "HtmlMediaElement", "HtmlInputElement", "Event", "EventTarget",
  "KeyboardEvent", "TouchEvent", "Touch", "TouchList", "EventSource", "MessageEvent",
  "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit",
  "MediaQueryList", "MediaQueryListEvent", "CssStyleDeclaration", "Performance", "TimeRanges",
  "ResizeObserver", "WheelEvent", "PointerEvent", "MouseEvent", "DomRect",
  "MutationObserver", "MutationObserverInit", "MutationRecord", "Node", "NodeList", "History",
  "Location", "ScrollToOptions", "ScrollBehavior", "Clipboard",
] }
